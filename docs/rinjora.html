<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinjora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FFF6E9; --card:#FFFFFF; --ink:#2A2420; --ink-soft:#7A6F63;
  --green:#17915A; --green-d:#0F6B41; --red:#E14B4B; --red-soft:#FDE7E4;
  --gold:#F6B21A; --green-soft:#E4F4EC; --gold-soft:#FDF1D8;
  --shadow:0 14px 30px -12px rgba(42,36,32,.28); --radius:26px;
  --accent:var(--green); --accent-soft:var(--green-soft); --accent-bd:#CDE9D9;
  /* --- Palette de la terre : chocolat d'Afrique & latérite du Burundi --- */
  --choco:#6B4226; --choco-l:#8B5A2B; --choco-d:#4A2C18;
  --terra:#B4441F; --terra-l:#C9603A; --ochre:#D89B4A; --sand:#F6E3C5;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color:var(--ink); background:var(--ivory); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
.imigongo{ height:14px; border-radius:20px 20px 0 0;
  background:repeating-linear-gradient(135deg, var(--green) 0 10px, var(--green-d) 10px 20px,
    var(--red) 20px 30px, #C63C3C 30px 40px, var(--gold) 40px 50px, #E09A0E 50px 60px); opacity:.9; }
.app{ width:100%; max-width:440px; background:var(--card); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; position:relative; }
.screen{ display:none; padding:24px 22px 26px; }
.screen.on{ display:block; animation:fadeUp .45s ease both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

/* ---------- ACCUEIL ---------- */
.home{ text-align:center; padding-top:16px; }
.mascot{ line-height:0; }
.mascot svg{ width:118px; height:auto; }
.flame{ transform-origin:60px 62px; animation:flick 2.4s ease-in-out infinite; }
@keyframes flick{ 0%,100%{transform:scaleY(1) scaleX(1);} 50%{transform:scaleY(1.07) scaleX(.96);} }
.glow{ animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.28;} 50%{opacity:.5;} }
.brand{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:46px; letter-spacing:-1px;
  color:var(--green-d); margin-top:4px; }
.slogan{ margin-top:4px; color:var(--ink-soft); font-weight:700; font-size:15px; }
.welcome{ margin-top:14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:19px; }
.menu{ margin-top:20px; display:flex; flex-direction:column; gap:12px; }
.mcard{ display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
  border:2.5px solid #EFE6D7; background:#FFFDF8; border-radius:20px; padding:15px 16px;
  transition:transform .1s, border-color .2s, background .2s; width:100%; font:inherit; color:inherit; }
.mcard:hover{ border-color:var(--c); background:#fff; }
.mcard:active{ transform:scale(.985); }
.mcard .ic{ width:52px; height:52px; flex:none; border-radius:16px; display:grid; place-items:center;
  background:var(--sand); border:2px solid #EBD3AE; }
.mcard .ic svg{ width:34px; height:34px; display:block; }
.mcard h3{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:19px; color:var(--c); }
.mcard p{ font-size:13.5px; color:var(--ink-soft); font-weight:700; margin-top:1px; }
.mcard .n{ margin-left:auto; font-weight:800; color:#C9BCA9; font-size:22px; }

/* ---------- BARRE / EN-TÊTE DE SECTION ---------- */
.topbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.progress{ flex:1; height:14px; background:#EFE6D7; border-radius:99px; overflow:hidden; }
.progress > i{ display:block; height:100%; width:0%; background:var(--accent);
  border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.pill{ display:flex; align-items:center; gap:5px; font-weight:800; font-size:15px;
  padding:6px 11px; border-radius:99px; background:var(--ivory); white-space:nowrap; }
.pill.star{ color:var(--gold); } .pill.fire{ color:var(--red); } .pill.hidden{ display:none; }
.eyebrow{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
.eyebrow .lab{ font-family:"Fredoka",sans-serif; font-weight:700; color:var(--accent); font-size:17px; }
.eyebrow .count{ color:var(--ink-soft); font-weight:800; font-size:14px; }

.riddle{ background:var(--accent-soft); border:2px solid var(--accent-bd); border-radius:20px;
  padding:26px 20px; min-height:130px; display:flex; align-items:center; justify-content:center;
  text-align:center; font-family:"Fredoka",sans-serif; font-weight:600; font-size:21px; line-height:1.4; }
.answer-box{ margin-top:14px; }
input[type=text], textarea, select{ width:100%; font-family:"Nunito",sans-serif; font-weight:700;
  font-size:17px; padding:15px 17px; border:2.5px solid #E7DECF; border-radius:16px;
  background:#FFFDF8; color:var(--ink); outline:none; transition:border-color .2s; }
textarea{ min-height:92px; resize:vertical; line-height:1.45; }
input::placeholder, textarea::placeholder{ color:#BCB0A0; font-weight:600; }
input:focus, textarea:focus, select:focus{ border-color:var(--accent); }
input:disabled{ opacity:.75; }
label.fl{ display:block; font-weight:800; font-size:14px; color:var(--ink-soft); margin:14px 0 6px 2px; }

.btn{ display:block; width:100%; border:none; cursor:pointer; font-family:"Fredoka",sans-serif;
  font-weight:600; font-size:18px; padding:15px; border-radius:16px; color:#fff; margin-top:11px;
  transition:transform .08s, filter .2s, box-shadow .2s; box-shadow:0 5px 0 rgba(0,0,0,.14); }
.btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }
.btn.green{ background:var(--green); } .btn.gold{ background:var(--gold); box-shadow:0 5px 0 #C98F0C; }
.btn.red{ background:var(--red); box-shadow:0 5px 0 #B23636; }
.btn.acc{ background:var(--accent); }
.btn:hover{ filter:brightness(1.05); }
.btn.ghost{ background:transparent; color:var(--ink-soft); box-shadow:none; font-size:15.5px; padding:12px; }
.btn.ghost:active{ transform:none; } .btn.ghost:hover{ color:var(--ink); filter:none; }
.btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.subrow{ display:flex; gap:9px; } .subrow .btn{ flex:1; margin-top:6px; }

.feedback{ display:none; margin-top:14px; border-radius:18px; padding:16px 18px; }
.feedback.on{ display:block; animation:pop .35s ease; }
.feedback.ok{ background:var(--green-soft); border:2px solid #B7E2C8; }
.feedback.no{ background:var(--red-soft); border:2px solid #F6C9C4; }
.feedback .fmsg{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:22px; }
.feedback.ok .fmsg{ color:var(--green-d); } .feedback.no .fmsg{ color:#C0392B; }
.feedback .fans{ margin-top:6px; font-weight:800; font-size:16px; }
.feedback .fans:empty{ display:none; }
.feedback .streakflair{ margin-top:4px; font-weight:800; color:var(--gold); font-size:16px; }
.feedback .streakflair:empty{ display:none; }
@keyframes pop{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:none;} }
.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-7px);} 40%,80%{transform:translateX(7px);} }

/* ---------- TUJAJURE ---------- */
.joke{ background:var(--gold-soft); border:2px solid #F3DFAF; border-radius:22px; padding:26px 20px;
  min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:14px; }
.joke .jt{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:21px; line-height:1.4; }
.joke .jp{ display:none; font-weight:800; font-size:19px; color:#B5820A; line-height:1.4;
  border-top:2px dashed #E7C880; padding-top:14px; width:100%; }
.joke .jp.on{ display:block; animation:pop .35s ease; }

/* ---------- FIN ---------- */
.end{ text-align:center; padding-top:8px; }
.end .party{ font-size:64px; }
.end h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:28px; color:var(--green-d); margin-top:6px; }
.scorecard{ margin:20px auto 6px; background:var(--ivory); border-radius:20px; padding:20px; }
.scorecard .big{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:44px; color:var(--red); }
.scorecard .lab{ color:var(--ink-soft); font-weight:800; margin-top:2px; }
.perf{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:18px; line-height:1.45; margin:14px auto 0; max-width:350px; }

/* ---------- CONTRIBUTION ---------- */
.sechead{ text-align:center; margin-bottom:6px; }
.sechead .ic{ font-size:42px; }
.sechead h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:26px; color:var(--green-d); margin-top:4px; }
.sechead p{ color:var(--ink-soft); font-weight:700; font-size:14px; margin-top:5px; line-height:1.45; }
.note{ background:var(--ivory); border-radius:14px; padding:12px 14px; font-size:13px;
  font-weight:700; color:var(--ink-soft); line-height:1.5; margin-top:14px; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--green-d); color:#fff; font-weight:800; padding:13px 20px; border-radius:99px;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.3s; z-index:20; font-size:15px; }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

.confetti{ position:fixed; top:-10vh; font-size:26px; pointer-events:none; z-index:9; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(115vh) rotate(360deg); opacity:0; } }


/* ---------- FOOTER ---------- */
.foot{ margin:22px -22px -26px; }
.foot .band{ height:8px; background:repeating-linear-gradient(135deg,
  var(--green) 0 8px, var(--green-d) 8px 16px, var(--terra) 16px 24px,
  #C63C3C 24px 32px, var(--gold) 32px 40px, #E09A0E 40px 48px); opacity:.85; }
.foot .inner{ background:var(--choco-d); color:#F6E3C5; text-align:center; padding:16px 18px 18px; }
.foot .fire{ font-size:20px; line-height:1; }
.foot .nm{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:16px; margin-top:2px; }
.foot .tg{ font-size:12px; opacity:.75; font-weight:700; margin-top:1px; }
.foot .cr{ font-size:11.5px; opacity:.55; font-weight:700; margin-top:14px; line-height:1.5; }
.foot-nav{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px; }
.fnav{ font-family:"Nunito",sans-serif; font-weight:800; font-size:12.5px; color:#FBEAD0;
  background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.16);
  border-radius:99px; padding:9px 14px; cursor:pointer; transition:background .15s, border-color .15s; }
.fnav:hover{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.3); }
.fnav:active{ transform:translateY(1px); }

/* ---------- BADGE NIVEAU ---------- */
.lvlbadge{ margin-left:auto; font-family:"Fredoka",sans-serif; font-weight:700; font-size:13px;
  color:#fff; background:var(--terra); padding:4px 11px; border-radius:99px; }

/* ---------- MODAL NIVEAU SUPÉRIEUR ---------- */
.modal{ position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
  padding:22px; background:rgba(42,24,16,.55); backdrop-filter:blur(3px); }
.modal.on{ display:flex; animation:fadeUp .3s ease both; }
.modal-card{ width:100%; max-width:360px; background:var(--card); border-radius:24px;
  padding:24px 22px; text-align:center; box-shadow:var(--shadow); }
.mchar{ margin:0 auto; width:120px; }
.mchar svg{ width:120px; height:auto; }
.mchar .arm{ transform-origin:60px 78px; animation:wave 1s ease-in-out infinite; }
@keyframes wave{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(-16deg);} }
.lvl-cheer{ font-family:"Fredoka",sans-serif; font-weight:600; color:var(--terra); font-size:16px; margin-top:6px; }
.modal-card h3{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:22px; margin:6px 4px 4px; line-height:1.3; }

/* ---------- OPTIONS À CHOIX MULTIPLE (Tujajure) ---------- */
.opt{ display:block; width:100%; text-align:left; font-family:"Nunito",sans-serif; font-weight:700;
  font-size:15.5px; line-height:1.42; padding:14px 16px; margin-top:10px; cursor:pointer;
  border:2.5px solid #EFE6D7; background:#FFFDF8; border-radius:16px; color:var(--ink);
  transition:border-color .15s, background .15s, transform .08s; }
.opt:hover{ border-color:var(--ochre); }
.opt:active{ transform:scale(.99); }
.opt:disabled{ cursor:default; }
.opt.correct{ border-color:var(--green); background:var(--green-soft); color:var(--green-d); font-weight:800; }
.opt.wrong{ border-color:var(--red); background:var(--red-soft); color:#C0392B; }

/* ---------- INVITE À RÉFLÉCHIR (Tujajure) ---------- */
.think{ text-align:center; margin-top:14px; font-family:"Fredoka",sans-serif; font-weight:600;
  font-size:17px; color:var(--terra); display:flex; align-items:center; justify-content:center; gap:8px; }
.think::before, .think::after{ content:""; height:2px; width:34px; border-radius:2px;
  background:linear-gradient(90deg,transparent,#EBD3AE); }
.think::after{ background:linear-gradient(90deg,#EBD3AE,transparent); }

/* ---------- SCÈNE D'ACCUEIL ---------- */
.hero{ margin:-24px -22px 0; line-height:0; position:relative; }
.hero svg{ width:100%; height:auto; display:block; }
.hero .flame2{ transform-origin:220px 168px; animation:flick 2.6s ease-in-out infinite; }
@keyframes flick{ 0%,100%{transform:scaleY(1) scaleX(1);} 50%{transform:scaleY(1.09) scaleX(.95);} }
.hero .glow2{ animation:pulse 2.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.30;} 50%{opacity:.55;} }
.hero .sway{ transform-origin:center bottom; animation:sway 3.4s ease-in-out infinite; }
@keyframes sway{ 0%,100%{transform:rotate(-2.5deg);} 50%{transform:rotate(2.5deg);} }
.hero .bob2{ animation:bob2 2.2s ease-in-out infinite; }
@keyframes bob2{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
.titlewrap{ text-align:center; margin-top:14px; }

/* ---------- IVYEREKEYE (à propos) ---------- */
.aboutcard{ background:linear-gradient(155deg,var(--choco),var(--terra)); color:#fff;
  border-radius:22px; padding:24px 22px; margin-top:6px; text-align:center; }
.aboutcard .logo{ margin:0 auto 8px; }
.aboutcard .logo svg{ width:64px; height:auto; }
.aboutcard h3{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:26px; }
.aboutcard .tag{ font-weight:800; opacity:.9; font-size:13.5px; margin-top:2px; }
.aboutcard hr{ border:none; height:2px; background:rgba(255,255,255,.25); margin:18px 0; border-radius:2px; }
.credit{ text-align:left; }
.credit .lab{ font-weight:800; font-size:12px; opacity:.75; letter-spacing:.4px; text-transform:uppercase; }
.credit .val{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:19px; margin:2px 0 14px; }
.credit .val:last-child{ margin-bottom:0; }

/* ---------- HISTORIQUE ---------- */
.bigstat{ background:linear-gradient(150deg,var(--choco),var(--terra)); color:#fff;
  border-radius:22px; padding:22px; text-align:center; margin-top:6px; }
.bigstat .n{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:52px; line-height:1; }
.bigstat .l{ font-weight:800; font-size:14px; opacity:.9; margin-top:4px; letter-spacing:.3px; }
.duo{ display:flex; gap:10px; margin-top:10px; }
.duo .box{ flex:1; background:var(--sand); border-radius:16px; padding:14px; text-align:center; }
.duo .box .n{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:26px; color:var(--choco); }
.duo .box .l{ font-weight:800; font-size:12px; color:var(--ink-soft); margin-top:2px; }
.srow{ display:flex; align-items:center; gap:12px; background:#FFFDF8; border:2px solid #EFE6D7;
  border-radius:16px; padding:12px 14px; margin-top:9px; }
.srow .ic2{ width:38px; height:38px; flex:none; border-radius:12px; background:var(--sand);
  display:grid; place-items:center; }
.srow .ic2 svg{ width:26px; height:26px; }
.srow .nm{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:16px; }
.srow .sub2{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }
.srow .pts{ margin-left:auto; font-family:"Fredoka",sans-serif; font-weight:700;
  font-size:19px; color:var(--terra); }
.empty{ text-align:center; color:var(--ink-soft); font-weight:700; font-size:14px;
  line-height:1.6; padding:26px 10px; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="imigongo"></div>

  <!-- ==================== ACCUEIL ==================== -->
  <section id="s-home" class="screen on home">
    <div class="hero">
      <svg viewBox="0 0 440 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abana bakina ku ziko">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5A3620"/><stop offset="48%" stop-color="#B4441F"/>
            <stop offset="100%" stop-color="#E8A33D"/>
          </linearGradient>
          <radialGradient id="halo" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#FFD98A" stop-opacity=".85"/>
            <stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="440" height="210" fill="url(#sky)"/>
        <circle cx="352" cy="96" r="26" fill="#F7DFA5" opacity=".55"/>
        <circle cx="86" cy="34" r="2.2" fill="#FFE9BC" opacity=".8"/>
        <circle cx="140" cy="22" r="1.6" fill="#FFE9BC" opacity=".7"/>
        <circle cx="286" cy="28" r="1.8" fill="#FFE9BC" opacity=".6"/>
        <!-- collines -->
        <path d="M0 120 q58 -34 116 -12 q66 -38 132 -6 q62 -30 122 -2 q40 16 70 8 V210 H0 Z" fill="#8B4A22" opacity=".55"/>
        <path d="M0 142 q70 -30 140 -8 q74 -28 150 -2 q72 -22 150 4 V210 H0 Z" fill="#5C3018"/>
        <path d="M0 168 q110 -20 220 -4 q110 16 220 -2 V210 H0 Z" fill="#3A2116"/>
        <!-- halo du feu -->
        <ellipse class="glow2" cx="220" cy="172" rx="104" ry="34" fill="url(#halo)"/>
        <!-- feu -->
        <ellipse cx="220" cy="180" rx="30" ry="8" fill="#2A1710"/>
        <rect x="198" y="172" width="44" height="6" rx="3" fill="#2A1710" transform="rotate(-8 220 175)"/>
        <rect x="200" y="176" width="40" height="6" rx="3" fill="#2A1710" transform="rotate(7 220 179)"/>
        <g class="flame2">
          <path d="M220 130 C210 148 205 156 205 165 a15 15 0 0 0 30 0 C235 156 230 148 220 130 Z" fill="#E8552A"/>
          <path d="M220 144 C214 155 211 160 211 165 a9 9 0 0 0 18 0 C229 160 226 155 220 144 Z" fill="#F0A63C"/>
          <ellipse cx="220" cy="167" rx="3.4" ry="4.6" fill="#FFE9BC"/>
        </g>
        <!-- étincelles -->
        <circle class="bob2" cx="206" cy="120" r="1.8" fill="#FFD98A" opacity=".9"/>
        <circle class="bob2" cx="234" cy="112" r="1.5" fill="#FFD98A" opacity=".75"/>
        <!-- ENFANTS (silhouettes) -->
        <g fill="#241209">
          <!-- assis à gauche, de profil -->
          <g><circle cx="150" cy="150" r="9"/>
            <path d="M141 162 q-4 12 0 20 h20 q3 -12 -3 -20 z"/>
            <path d="M158 178 q16 0 22 6 h-24 z"/>
            <path d="M150 164 q12 1 17 7" stroke="#241209" stroke-width="5" fill="none" stroke-linecap="round"/></g>
          <!-- assis à droite, de profil -->
          <g><circle cx="290" cy="150" r="9"/>
            <path d="M299 162 q4 12 0 20 h-20 q-3 -12 3 -20 z"/>
            <path d="M282 178 q-16 0 -22 6 h24 z"/>
            <path d="M290 164 q-12 1 -17 7" stroke="#241209" stroke-width="5" fill="none" stroke-linecap="round"/></g>
          <!-- debout, bras levés (danse) -->
          <g class="sway"><circle cx="96" cy="132" r="10"/>
            <path d="M89 144 q-3 20 1 32 h12 q4 -12 1 -32 z"/>
            <path d="M91 150 q-14 -6 -18 -18" stroke="#241209" stroke-width="5.5" fill="none" stroke-linecap="round"/>
            <path d="M101 150 q14 -6 18 -18" stroke="#241209" stroke-width="5.5" fill="none" stroke-linecap="round"/>
            <path d="M92 176 l-5 18" stroke="#241209" stroke-width="6" stroke-linecap="round"/>
            <path d="M100 176 l6 18" stroke="#241209" stroke-width="6" stroke-linecap="round"/></g>
          <!-- petit qui saute -->
          <g class="bob2"><circle cx="346" cy="138" r="8"/>
            <path d="M340 148 q-2 16 1 26 h10 q3 -10 1 -26 z"/>

function normReorder(s){
  s=(s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’‘`´]/g," ").replace(/[.,!?;:()"…]/g," ").replace(/\s+/g," ").trim();
  const t=s.split(" ").filter(x=>x&&x!=="na"&&x!=="n"); t.sort(); return t.join(" ");
}
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i];
    for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c; } return p[n]; }
const tol = l => l<=4?0 : l<=7?1 : 2;
function sigWords(str){
  return (str||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’‘`´]/g," ").replace(/[.,!?;:()"…]/g," ")
    .split(/\s+/).filter(w=>w.length>=4);            // mots "de contenu"
}
function suffixeCommun(a,b){ let k=0,i=a.length-1,j=b.length-1;
  while(i>=0&&j>=0&&a[i]===b[j]){ k++; i--; j--; } return k; }
function motsProches(g,a){
  if(g===a) return true;
  if(lev(g,a) <= tol(Math.max(g.length,a.length))) return true;   // petite faute
  if(g.length>=4 && (a.indexOf(g)>=0 || g.indexOf(a)>=0)) return true; // même radical
  if(suffixeCommun(g,a) >= 4) return true;                        // uruyuki / akayuki
  return false;
}
/* On accepte : réponse exacte, petite faute, ordre libre, OU une seule partie juste. */
function estCorrect(s,rep){
  const g = normReorder(s); if(!g) return false;
  const gw = sigWords(s);
  return rep.split("/").some(v=>{
    const r = normReorder(v); if(!r) return false;
    if(g===r) return true;
    if(lev(g,r) <= tol(r.length)) return true;
    const aw = sigWords(v);
    return gw.length>0 && gw.some(x => aw.some(y => motsProches(x,y)));
  });
}
const estNdaguhaye = s => normReorder(s)==="ndaguhaye";
const pick = a => a[Math.floor(Math.random()*a.length)];
const score = () => answers.filter(a=>a&&a.status==="correct").length;
const firstAns = d => d.a.split("/")[0].trim();
const allAns = d => d.a.split("/").map(x=>x.trim()).join(" / ");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* --- Niveaux : difficulté estimée (réponse + énoncé), du plus simple au plus corsé --- */
function difficulte(it){ const q=(it.q||it.t||"").length, a=(it.a||it.p||"").length; return a*2 + q; }
function poolNiveau(src, lvl){
  const tri = src.slice().sort((x,y)=>difficulte(x)-difficulte(y));
  const n = tri.length;
  const pas = Math.max(ROUND_SIZE, Math.floor(n/5));
  const debut = Math.min((lvl-1)*pas, Math.max(0, n-ROUND_SIZE));
  const part = tri.slice(debut);
  return { pool: shuffle(part).slice(0, Math.min(ROUND_SIZE, part.length)),
           hasNext: debut < (n - ROUND_SIZE) };
}

/* ---------- QUIZ ---------- */
function lancerQuiz(m, cont){
  mode=m;
  if(!cont) level=1;
  const src = (m==="sokwe") ? SOKWE : HERAHEZA;
  const root=document.documentElement.style;
  if(m==="sokwe"){ root.setProperty("--accent","var(--green)"); root.setProperty("--accent-soft","var(--green-soft)"); root.setProperty("--accent-bd","#CDE9D9"); }
  else { root.setProperty("--accent","#B5820A"); root.setProperty("--accent-soft","var(--gold-soft)"); root.setProperty("--accent-bd","#F3DFAF"); }
  $("ui-lab").textContent = (m==="sokwe") ? T.labSokwe : T.labHera;
  $("answer").placeholder = (m==="sokwe") ? T.phSokwe : T.phHera;
  $("ui-level").textContent = T.level+" "+level;
  const r = poolNiveau(src, level);
  pool = r.pool; curHasNext = r.hasNext;
  answers = new Array(pool.length); index=0; streak=0;
  majPills(); montrer("s-quiz"); showItem(0);
}
function majPills(){
  $("pill-score").innerHTML="⭐ "+score();
  const f=$("pill-fire");
  if(streak>0){ f.classList.remove("hidden"); f.innerHTML="🔥 "+streak; } else f.classList.add("hidden");
}
function showItem(i){
  index=i; const d=pool[i], a=answers[i], st=a?a.status:"fresh";
  const inp=$("answer"), fb=$("feedback");
  $("riddle").textContent=d.q;
  $("ui-count").textContent=motNombre(i+1)+" / "+pool.length;
  $("bar").style.width=(i/pool.length*100)+"%";
  $("btn-back").style.display=(i>0)?"block":"none";
  ["btn-check","btn-give","btn-skip","btn-next"].forEach(b=>$(b).style.display="none");

  if(st==="correct"||st==="conceded"){
    inp.value=a.given||""; inp.disabled=true;
    fb.className="feedback on "+(a.correct?"ok":"no");
    $("fmsg").textContent=a.msg; $("fstreak").textContent=a.flair||"";
    $("fans").textContent=(mode==="sokwe"?T.answerIntro:T.heraIntro)+" : "+
      (mode==="sokwe" ? allAns(d) : d.q.replace(/…$/,"")+" "+firstAns(d));
    $("btn-next").style.display="block";
  } else if(st==="trying"){
    inp.value=""; inp.disabled=false;
    fb.className="feedback on no";
    $("fmsg").textContent=T.impa; $("fstreak").textContent=""; $("fans").textContent="";
    $("btn-check").style.display="block"; $("btn-give").style.display="block"; inp.focus();
  } else {
    inp.value=""; inp.disabled=false; fb.className="feedback";
    $("btn-check").style.display="block"; $("btn-skip").style.display="block"; inp.focus();
  }
}
function verifier(){
  const a=answers[index];
  if(a&&(a.status==="correct"||a.status==="conceded")) return;
  const s=$("answer").value;
  if(!normReorder(s)){ $("answer").focus(); return; }
  if(estNdaguhaye(s)){ conceder(); return; }
  if(estCorrect(s,pool[index].a)){
    streak++;
    answers[index]={status:"correct",given:s,correct:true,msg:pick(T.good),flair:(streak>=2?T.streakMsg:"")};
    majPills(); showItem(index); confettis();
  } else {
    answers[index]={status:"trying",given:"",correct:false,msg:T.impa,flair:""};
    showItem(index);
    const fb=$("feedback"); fb.classList.add("shake"); setTimeout(()=>fb.classList.remove("shake"),450);
  }
}
function conceder(){
  const a=answers[index];
  if(a&&(a.status==="correct"||a.status==="conceded")) return;
  streak=0;
  answers[index]={status:"conceded",given:"",correct:false,msg:T.concedeMsg,flair:""};
  majPills(); showItem(index);
}
function precedente(){ if(index>0) showItem(index-1); }
function suivante(){
  const a=answers[index];
  if(!a||a.status==="trying") return;
  if(index>=pool.length-1) finir(); else showItem(index+1);
}
function finir(){
  $("bar").style.width="100%";
  const sc=score();
  noterPartie(mode==="hera"?"hera":"sokwe", sc, pool.length);
  if(sc>=8 && curHasNext){ pendingScore=sc; $("lvlup").classList.add("on"); return; }
  showEnd(sc);
}
function showEnd(sc){
  $("end-score").textContent=sc+" / "+pool.length;
  $("end-scorelab").textContent=T.scoreLab;
  $("end-perf").textContent = sc>=8?T.perfTop : sc>=5?T.perfMid : T.perfLow;
  montrer("s-end"); if(sc>=5) confettis(28);
}

function lancerJokes(){
  mode="tuja";
  jokes=shuffle(TUJAJURE).slice(0,Math.min(ROUND_SIZE,TUJAJURE.length));
  jState=new Array(jokes.length);
  jIndex=0; jScore=0; montrer("s-joke"); showJoke();
}
/* Génère 4 choix : la bonne chute + 3 chutes tirées d'autres utujajuro */
function optionsPour(i){
  const bonne=jokes[i].p;
  const autres=shuffle(TUJAJURE.filter(x=>x.p!==bonne).map(x=>x.p)).slice(0,3);
  return shuffle([bonne, ...autres]);
}
function showJoke(){
  const j=jokes[jIndex];
  let st=jState[jIndex];
  if(!st){ st={opts:optionsPour(jIndex), chosen:-1, correct:false}; jState[jIndex]=st; }
  $("j-text").textContent=j.t;
  $("j-count").textContent=motNombre(jIndex+1)+" / "+jokes.length;

  const box=$("j-opts"); box.innerHTML="";
  st.opts.forEach((o,k)=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=o;
    if(st.chosen>=0){
      b.disabled=true;
      if(o===j.p) b.classList.add("correct");
      else if(k===st.chosen) b.classList.add("wrong");
    } else { b.onclick=()=>choisirJoke(k); }
    box.appendChild(b);
  });

  const fb=$("j-fb");
  if(st.chosen>=0){
    fb.className="feedback on "+(st.correct?"ok":"no");
    $("j-fmsg").textContent = st.correct ? pick(T.good) : T.concedeMsg;
    $("j-think").style.display="none";
    $("j-next").style.display="block";
  } else {
    fb.className="feedback";
    $("j-think").style.display="flex";
    $("j-next").style.display="none";
  }
}
function choisirJoke(k){
  const st=jState[jIndex]; if(st.chosen>=0) return;
  st.chosen=k; st.correct=(st.opts[k]===jokes[jIndex].p);
  if(st.correct){ jScore++; confettis(10); }
  majJoke();
}
function majJoke(){ showJoke(); }
function nextJoke(){ if(jIndex>=jokes.length-1) finirJokes(); else { jIndex++; showJoke(); } }
function finirJokes(){
  $("end-score").textContent=jScore+" / "+jokes.length;
  $("end-scorelab").textContent=T.jScoreLab;
  $("end-perf").textContent = jScore>=8?T.perfTop : jScore>=5?T.perfMid : T.perfLow;
  noterPartie("tuja", jScore, jokes.length);
  montrer("s-end"); if(jScore>=5) confettis(28);
}

/* ---------- DIVERS ---------- */
function confettis(n){
  n=n||14;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const emo=["🎉","⭐","🔥","💫","🟢","🔴","🟡","🐇"];
  for(let i=0;i<n;i++){
    const c=document.createElement("span");
    c.className="confetti"; c.textContent=pick(emo);
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(1.6+Math.random()*1.4)+"s";
    c.style.fontSize=(18+Math.random()*18)+"px";
    document.body.appendChild(c); setTimeout(()=>c.remove(),3200);
  }
}
async function partager(){
  const txt="Rinjora — "+T.slogan+" — "+$("end-score").textContent+" ⭐";
  try{ if(navigator.share) await navigator.share({text:txt});
       else { await navigator.clipboard.writeText(txt); toast(T.cCopied); } }catch(e){}
}


/* ==================================================================
   AMATEKA — historique conservé dans le navigateur de la personne
   ================================================================== */
const SKEY = "rinjora_amateka_v1";
const STATS0 = { total:0, games:0, best:0,
  sokwe:{g:0,p:0}, hera:{g:0,p:0}, tuja:{g:0,p:0} };
let STATS = chargerStats();

function chargerStats(){
  try{
    const r = localStorage.getItem(SKEY);
    if(r) return Object.assign({}, STATS0, JSON.parse(r));
  }catch(e){}
  return JSON.parse(JSON.stringify(STATS0));
}
function sauverStats(){
  try{ localStorage.setItem(SKEY, JSON.stringify(STATS)); }catch(e){}
}
function noterPartie(dom, points, sur){
  const d = STATS[dom] || (STATS[dom]={g:0,p:0});
  d.g += 1; d.p += points;
  STATS.total += points; STATS.games += 1;
  if(points > STATS.best) STATS.best = points;
  sauverStats();
}

const ICONS = {
  sokwe:'<svg viewBox="0 0 64 64"><ellipse cx="21" cy="20" rx="6.5" ry="17" fill="var(--choco)" transform="rotate(-13 21 20)"/><ellipse cx="43" cy="20" rx="6.5" ry="17" fill="var(--choco)" transform="rotate(13 43 20)"/><ellipse cx="32" cy="45" rx="17" ry="15" fill="var(--choco-l)"/><circle cx="25" cy="42" r="2.7" fill="var(--choco-d)"/><circle cx="39" cy="42" r="2.7" fill="var(--choco-d)"/></svg>',
  hera:'<svg viewBox="0 0 64 64"><path d="M32 9 C21 9 14 15 14.5 23 C9 26 8.5 34 13 38 C13 46 19 52 27 52 C29 55 35 55 37 52 C45 52 51 46 51 38 C55.5 34 55 26 49.5 23 C50 15 43 9 32 9 Z" fill="var(--choco-l)"/><path d="M32 9 V55" stroke="var(--choco-d)" stroke-width="2.4" fill="none"/></svg>',
  tuja:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23" fill="var(--ochre)"/><path d="M16 25 q6 -7 12 0 M36 25 q6 -7 12 0" stroke="var(--choco-d)" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M17 35 h30 a15 15 0 0 1 -30 0 Z" fill="var(--choco-d)"/></svg>'
};

function montrerHist(){
  $("h-title").textContent=T.hTitle; $("h-sub").textContent=T.hSub;
  $("h-totall").textContent=T.hTotal; $("h-gamesl").textContent=T.hGames; $("h-bestl").textContent=T.hBest;
  $("h-reset").textContent=T.hReset; $("h-quit").textContent=T.quit;

  const vide = STATS.games === 0;
  $("h-body").style.display  = vide ? "none" : "block";
  $("h-reset").style.display = vide ? "none" : "block";
  const em=$("h-empty");
  em.style.display = vide ? "block" : "none";
  em.textContent = T.hEmpty;

  if(!vide){
    $("h-total").textContent = STATS.total;
    $("h-games").textContent = STATS.games;
    $("h-best").textContent  = STATS.best;
    const noms={sokwe:T.nSokwe, hera:T.nHera, tuja:T.nTuja};
    $("h-rows").innerHTML = ["sokwe","hera","tuja"].map(k=>{
      const d=STATS[k]||{g:0,p:0};
      return '<div class="srow"><span class="ic2">'+ICONS[k]+'</span>'+
             '<span><span class="nm">'+noms[k]+'</span><br>'+
             '<span class="sub2">'+d.g+' '+T.nPlayed+'</span></span>'+
             '<span class="pts">⭐ '+d.p+'</span></div>';
    }).join("");
  }
  montrer("s-hist");
}
function resetHist(){
  if(!confirm(T.hAsk)) return;
  STATS = JSON.parse(JSON.stringify(STATS0));
  sauverStats(); toast(T.hDone); montrerHist();
}
